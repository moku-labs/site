name: Docs update

# When CI fails on a Dependabot bump of @moku-labs/*, Claude updates content/docs by the
# update-docs skill (scripts/update-docs.ts, Agent SDK, billed to the API credits of
# ANTHROPIC_API_KEY) and pushes the fix to the PR branch. workflow_run runs the copy of this file
# on main, so a change here takes effect after it is merged.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: docs-update-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/bun/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # DOCS_BOT_TOKEN (a PAT or app token with contents: write) makes the push start CI again;
      # a push with the default token does not, and the PR would keep its red check.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.DOCS_BOT_TOKEN || github.token }}

      # One attempt per bump: a branch whose last commit is already the bot's is left to a person.
      - name: Skip when the bot already tried
        id: guard
        run: |
          if [ "$(git log -1 --format=%an)" = "moku-docs-bot" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The last commit is the docs bot's: not running again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - if: steps.guard.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Update the docs
        if: steps.guard.outputs.skip != 'true'
        run: bun run docs:update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DOCS_BUDGET_USD: "5"

      # The agent says it is green; the push waits for the same checks CI runs.
      - name: Check
        if: steps.guard.outputs.skip != 'true'
        run: bun run typecheck && bun run lint && bun run test:coverage

      - name: Push the fix
        if: steps.guard.outputs.skip != 'true'
        run: |
          git add content/docs content/snippet-stubs
          if git diff --cached --quiet; then
            echo "No docs change to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name=moku-docs-bot -c user.email=docs-bot@moku-labs.com \
            commit -m "docs: follow the moku bump on this branch"
          git push origin HEAD
