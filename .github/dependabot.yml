version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    # Only the family's own packages. Third-party versions are updated by hand.
    allow:
      - dependency-name: "@moku-labs/*"
    # Dependabot holds every new version back for 3 days by default. The family's own
    # packages are trusted the moment they are released, so they skip that wait.
    cooldown:
      default-days: 3
      exclude:
        - "@moku-labs/*"
    groups:
      moku:
        patterns:
          - "@moku-labs/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "moku-labs/*"
