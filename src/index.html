<!DOCTYPE html>
<html lang="<!--moku:lang-->">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Theme before first paint: ?theme= (kept for the visit) → sessionStorage → OS preference.
         The theme-toggle island writes the same "moku-theme" key. -->
    <script>
      (() => {
        const key = "moku-theme";
        const valid = value => (value === "light" || value === "dark" ? value : undefined);
        let theme;
        try {
          const forced = valid(new URLSearchParams(location.search).get("theme"));
          if (forced) sessionStorage.setItem(key, forced);
          theme = forced ?? valid(sessionStorage.getItem(key));
        } catch {}
        theme ??= matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preload" href="/fonts/sora/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/instrument-sans/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!--moku:head-->
    <!--moku:assets-->
  </head>
  <body><!--moku:body--></body>
</html>
